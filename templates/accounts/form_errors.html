{% load i18n %}
{% if form.errors %}<div class="notice error" id="farm-form-errors" role="alert" tabindex="-1"><div>{{ form.non_field_errors }}</div><ul>{% for field in form %}{% for error in field.errors %}<li><a href="#{{ field.id_for_label }}">{{ field.label }}: {{ error }}</a></li>{% endfor %}{% endfor %}</ul></div>{% endif %}
