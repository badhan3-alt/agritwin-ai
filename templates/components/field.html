{% load i18n bangla %}
<div class="form-field {% if field.errors %}has-error{% endif %} {% if wide %}span-2{% endif %}">{% if field.name == 'current_crops' %}<fieldset><legend>{{ field.label }}{% if field.field.required %}<span class="required-mark" aria-label="{% translate 'required' %}">*</span>{% endif %}</legend>{{ field }}</fieldset>{% else %}<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required-mark" aria-label="{% translate 'required' %}">*</span>{% endif %}</label>{{ field }}{% endif %}{% if field.help_text %}<p class="field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}{% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}</div>
